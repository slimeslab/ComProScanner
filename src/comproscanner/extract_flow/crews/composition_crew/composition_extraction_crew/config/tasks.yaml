extract_composition_property:
  description: |
    **Task**: Extract Material Compositions and Properties
    **Description**: Extract the material compositions and their corresponding {main_extraction_keyword} data from the given text to create a structured JSON output with the following fields-
    {schema_fields_description}

    *Other Points to Consider*
    {equation_tool_task_guidance}
    {formula_notation_rules}
    - If any composition has variable (x,y,z etc.) values, write the variable values with where and the variable values similar to the following manner-
    {expected_variable_composition_property_example}
    - Only consider the article's own work data. Don't consider referenced paper's data. Sometimes in the table compositions and corresponding property data from referenced papers are mentioned. Even don't consider similar phrases 'modified-composition' or 'composition-based' etc. phases where the full composition is not provided.
    {graph_extractor_task_guidance}

    **Parameters**:
    - Property: {main_extraction_keyword}
    - Text data containing compositions and property details:
    {composition_property_text_data}

    {composition_property_extraction_task_note}
  expected_output: >
    A JSON object with these fields: {schema_field_names}.
  agent: composition_property_extractor
