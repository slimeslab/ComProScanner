extract_composition_property:
  description: |
    **Task**: Extract Material Compositions and Properties
    **Description**: Extract the material compositions and their corresponding {main_extraction_keyword} values, unit corresponding to {main_extraction_keyword} data and family of the materials from the given text to create a structured JSON output like the following-
    {{
      "compositions": {{
        "full chemical formula with proper fractions mentioned": {main_extraction_keyword} value,
        ...
      }},
      "property_unit": "unit of {main_extraction_keyword} measurement",
      "family": "material family name"
    }}
    If, any abbreviation is present with the composition, create another key with the abbreviation and full composition, for e.g.-
    "abbreviations": {{
      "g-CN": "g-C3N4",
    }}
    *Abbreviation Note*:
    - DON'T consider greek letters for abbreviation, for e.g. α should not be taken as 'Alpha'.
    - DON'T consider any chemical composition in english word, for e.g. ZnO should not be taken as 'zinc oxide'.
    - FOCUS on abbreviations with all CAPITAL letters. They MUST be considered.

    *Other Points to Consider*
    - Before extracting final compositions, you MUST call Equation Tool once with doi={doi}.
    - For Equation Tool's text argument, send a compact "formula-evidence summary" rather than the entire paper text.
    - The summary should contain only: base/host formula, dopant and valence clues, substitution/replacement or incorporation site, replaced ion, variable definitions and values (x, y, mol%, at%), phase-purity evidence (single-phase/impurity statements), and relevant charge-compensation hints.
    - Do not include broad introduction text, unrelated methods, or full-section dumps in this summary.
    - If Equation Tool returns a formula, you MUST use that formula as the primary variable-composition template for final extraction unless explicit article evidence proves it incorrect.
    - Do not skip/ignore Equation Tool output when assigning variable substitution sites or charge-balanced variable forms.
    - Formula notation rule: DO NOT use underscore-based subscripts (avoid forms like Ba_0.91, Ti_0.93, O_3).
    - Use plain-text variable notation such as (1-x), x, (0.935+x), Ti(1-x), (Pr1/2Nb1/2)(x).
    - Add disambiguating parentheses whenever variable scope can be misread. Example: write ((Bi1/2Na1/2)(0.935+x))(Ba0.065)(Ti(1-x))(Pr1/2Nb1/2)(x)O3 instead of an ambiguous linear form.
    - If any composition has variable (x,y,z etc.) values, write the variable values with where and the variable values similar to the following manner-
    {expected_variable_composition_property_example}
    Also, wherever single variable is present you MUST WRAP it within a (), For e.g.- (1-x)Na2xBayTi2O3 should be (1-x)Na2(x)Ba(y)TiO3.
    - Only consider the article's own work data. Don't consider referenced paper's data. Sometimes in the table compositions and corresponding property data from referenced papers are mentioned. However, DON'T consider abbreviations for referenced papers. Even don't consider similar phrases 'modified-composition' or 'composition-based' etc. phases where the full composition is not provided.
    - You MUST invoke the Graph Data Extractor tool once with doi={doi} and consider its extracted numeric points when producing the final JSON.
    - Conflict resolution rule: if the same composition appears in both text extraction and graph extraction with different values, keep the text-extracted value and ignore the graph value for that composition.
    - Use graph extraction only as fallback/supplement for compositions or values missing from text.

    **Parameters**:
    - Property: {main_extraction_keyword}
    - Text data containing compositions and property details: 
    {composition_property_text_data}

    {composition_property_extraction_task_note}
  expected_output: >
    Dictionary of material compositions, corresponding {main_extraction_keyword} property values, {main_extraction_keyword} unit and composition family.
  agent: composition_property_extractor
