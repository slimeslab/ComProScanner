format_composition_property:
  description: |
    **Task**: Format Material Compositions and Properties
    **Description**: Format the extracted material composition and properties data. Focus on the 'Notes' if anything is provided. You MUST use 'MaterialParserTool' as tool if there is any variable in the composition in {extracted_composition_data}. Just resolve the variables - but don't do any final numerical calculation to get the composition percentage by yourself and keep the formula same as the original.
    - After receiving the MaterialParserTool output, VERIFY that every variable was substituted correctly. For each sub-expression containing variables (e.g. `(1-x-y)`), manually confirm that all variables in that expression were replaced with their given values. For example, `(1-x-y)` with x=0.10, y=0.010 must resolve to `(1-0.10-0.010)`, NOT `(0.9-0.010)` (partial substitution is wrong). If the tool's resolved formula contains any incorrect or incomplete substitution, OVERRIDE it with the correctly substituted expression. The override must still follow the BODMAS bracket notation and must NOT collapse the expression to a single number — just substitute variable symbols with their numeric values.
    - If any abbreviated form of composition is present rewrite with the actual composition. But DON'T modify the chemical composition / periodic element with chemical name / element name for e.g., Bi should not be replaced with Bismuth or BaTiO3 should not be replaced with Barium titanate.
    - If composition has variables with equation, after resolving the variable the formula should be written in a form of BODMAS rule with only () as brackets, + as addition, - as subtraction, * as multiplication and / as division. For e.g, ABx-2y/5C3 is a chemical formula, where A, B, C are periodic elements and x and y are variables with values x=2, y=3, the final chemical formula should be written as AB(2-((2*3)/5))O3 so that BODMAS rule can be applied later.
    - IMPORTANT: Remove the compositions with null property value. But DON'T ever remove compositions with property values.

    **Parameters**:
    - Extracted composition-property dictionary-
    {extracted_composition_data}

    The extracted output should look like the following-
    {expected_composition_property_example}

    {composition_property_formatting_task_note}
  expected_output: >
    Dictionary of material compositions, corresponding {main_extraction_keyword} property values, {main_extraction_keyword} unit and composition family.
  agent: composition_property_formatter
